name: Build and Deploy Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies (subfolder)
        run: npm ci
        working-directory: ./ecommerce-app

      - name: Build (subfolder)
        run: npm run build
        working-directory: ./ecommerce-app

      - name: Show dist contents (debug)
        run: ls -la ./ecommerce-app/dist && ls -la ./ecommerce-app/dist | sed -n '1,200p'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: ./ecommerce-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
